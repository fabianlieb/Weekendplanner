# Build, test and deploy the app in app/ to GitHub Pages on every push to main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Monthly: refresh the route catalogue (swisstopo/SAC, ASTRA) and redeploy.
  schedule:
    - cron: '0 4 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Refresh route catalogue
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        # On failure the committed catalogue snapshot is used.
        continue-on-error: true
        run: node scripts/build-catalog.mjs
      - name: Build
        run: npm run build
        env:
          # Pages serves the site at https://<user>.github.io/<repo>/
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
